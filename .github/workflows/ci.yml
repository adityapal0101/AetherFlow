name: AetherFlow CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Lint Rust contracts
  # ─────────────────────────────────────────────
  lint-contracts:
    name: Lint Rust contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Check formatting
        run: cd contracts && cargo fmt --all -- --check

  # ─────────────────────────────────────────────
  # JOB 2 — Test Soroban contracts
  # ─────────────────────────────────────────────
  test-contracts:
    name: Test Soroban contracts
    runs-on: ubuntu-latest
    needs: lint-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run all contract tests
        run: cd contracts && cargo test --all -- --nocapture

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: contracts/target/

  # ─────────────────────────────────────────────
  # JOB 3 — Build Soroban WASM
  # ─────────────────────────────────────────────
  build-contracts:
    name: Build Soroban WASM
    runs-on: ubuntu-latest
    needs: test-contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Build aether-token
        run: cd contracts/aether-token && cargo build --target wasm32-unknown-unknown --release

      - name: Build aether-pool
        run: cd contracts/aether-pool && cargo build --target wasm32-unknown-unknown --release

      - name: Build aether-router
        run: cd contracts/aether-router && cargo build --target wasm32-unknown-unknown --release

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: contracts/target/wasm32-unknown-unknown/release/*.wasm

  # ─────────────────────────────────────────────
  # JOB 4 — Lint + typecheck frontend
  # ─────────────────────────────────────────────
  lint-frontend:
    name: Lint + typecheck frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - run: cd frontend && npm run lint

      - run: cd frontend && npm test

  # ─────────────────────────────────────────────
  # JOB 5 — Build Next.js frontend (static export)
  # ─────────────────────────────────────────────
  build-frontend:
    name: Build Next.js frontend
    runs-on: ubuntu-latest
    needs: lint-frontend
    env:
      NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - run: cd frontend && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: frontend/out/
